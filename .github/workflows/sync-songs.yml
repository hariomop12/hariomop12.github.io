name: Sync Playlist Songs

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch playlist and update songs
        run: node .github/scripts/sync-songs.mjs

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/songs.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No playlist changes, skipping commit"
            exit 0
          fi
          git commit -m "Sync playlist songs"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run "Deploy GitHub Pages" --repo $GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ github.token }}
